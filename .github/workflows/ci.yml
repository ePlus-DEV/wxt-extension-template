name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: yarn }
      - run: corepack enable
      - run: yarn install
      - run: yarn compile
      - run: yarn lint
      - run: yarn test
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { browser: [chrome, firefox, edge, opera] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: yarn }
      - run: corepack enable
      - run: yarn install
      - run: yarn wxt build -b ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: .output/${{ matrix.browser }}-mv3/
